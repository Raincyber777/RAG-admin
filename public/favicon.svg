<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="t" x1="5" y1="3" x2="27" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e2249"/><stop offset="1" stop-color="#0a0c1e"/>
    </linearGradient>
    <linearGradient id="s" x1="9" y1="6" x2="25" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d9d3fd">
        <animate attributeName="stop-color" values="#d9d3fd;#b7a9f7;#9d8cf1;#d9d3fd" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#9d8cf1">
